name: Secrets and internal docs

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is fetched so the range below can see the parent.
          # The git scan still covers only the new commits, not older history.
          fetch-depth: 0

      - name: Reject internal-doc paths and markers
        run: bash scripts/check-public-tree.sh

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan the tree at this commit. Full history still contains secrets until
      # scripts/history-purge.sh is run and the owner force-pushes. Scanning
      # --all here would fail every pull request for leaks that are already public.
      - name: Gitleaks (current tree)
        run: gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

      # Git mode, limited to commits introduced by this push or pull request.
      - name: Gitleaks (new commits)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${PUSH_SHA}"
          else
            echo "No parent commit on this push. The tree scan covers this revision."
            exit 0
          fi
          echo "Scanning git range ${range}"
          gitleaks detect --redact --no-banner --exit-code 1 --log-opts="${range}"
