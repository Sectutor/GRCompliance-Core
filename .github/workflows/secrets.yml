name: Secrets and internal docs

# gitleaks-action requires a GITLEAKS_LICENSE on organisation repositories.
# This repository belongs to the Sectutor organisation, so the job runs the
# official gitleaks binary instead. The version and checksum are pinned.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a default-branch push can scan every commit, and
          # so a pull request range can see the base commit.
          fetch-depth: 0

      - name: Reject internal-doc paths and markers
        run: bash scripts/check-public-tree.sh

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      # Pushes to the default branch scan every commit in the clone.
      - name: Gitleaks full history
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts="--all"

      # Pull requests scan the commits introduced by the pull request.
      - name: Gitleaks pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          echo "Scanning git range ${range}"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts="${range}"

      # Other branch pushes scan the commits added by that push.
      - name: Gitleaks branch push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${zero}" ]; then
            range="${BEFORE_SHA}..${PUSH_SHA}"
          elif git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" >/dev/null; then
            range="origin/${DEFAULT_BRANCH}..${PUSH_SHA}"
          else
            range="${PUSH_SHA}"
          fi
          echo "Scanning git range ${range}"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts="${range}"
