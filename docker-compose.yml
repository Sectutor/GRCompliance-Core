name: grcompliance

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-grcompliance}
    volumes:
      - grc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - grc_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    image: ghcr.io/sectutor/grcompliance-core:${GRC_VERSION:-latest}
    build:
      context: ${GRC_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_MODE: ${AUTH_MODE:-local}
      PORT: "3001"
      LISTEN_ADDR: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@grcompliance.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      APP_URL: ${APP_URL:?}
      VITE_ENABLE_PREMIUM: "false"
      VITE_APP_MODE: production
      ENABLE_THREAT_SCHEDULER: "false"
      ENABLE_LICENSE_RENEWAL_SCHEDULER: "false"
      ENABLE_POLICY_REVIEW_SCHEDULER: "false"
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-false}
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - grc_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped

volumes:
  grc_postgres:
  grc_redis:
  grc_uploads:
